# Minimal remote validation, kept deliberately off `develop` to save Actions
# quota. See AGENTS.md ("Remote validation layer") for the rationale: local
# pre-commit is the primary gate everywhere, including develop; this workflow
# only runs at the two deliberate, infrequent promotion points (staging, main) or
# on demand.
name: PR checks

on:
  pull_request:
    branches: [staging, main]
  workflow_dispatch: {}

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run file-content hooks
        run: pre-commit run --all-files

      # The Conventional Commits lint that used to live here was removed
      # deliberately. It ran only on pull requests into staging/main, and on a
      # promotion PR every commit in range is already merged into develop — so
      # it could report unfixable history and nothing else. Correcting a finding
      # meant rewriting a protected branch.
      #
      # The one place it could have prevented something is a work branch into
      # develop, which is exactly where this workflow does not run, by design.
      # The commit-msg hook in .pre-commit-config.yaml already gates every
      # commit as it is written, which is both earlier and cheaper.

  # Promotions only: a pull request into staging must come from develop, and
  # into main from staging.
  #
  # Rulesets require a pull request and block direct pushes, force-pushes and
  # deletion, but place no constraint on where a pull request comes FROM. A
  # single-parent commit landed straight on main in this repository that way, so
  # develop and staging both lacked the file — and because a staging -> main
  # merge preserves main's side, every later promotion re-showed the same
  # difference until someone back-merged.
  #
  # hotfix/ is not an exception: the git-governance taxonomy is explicit that
  # the label signals urgency, not a bypass route.
  promotion-source:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check the pull request comes from the branch below it
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          case "$BASE" in
            staging) expected=develop ;;
            main)    expected=staging ;;
            *)       echo "No promotion constraint on '$BASE'."; exit 0 ;;
          esac
          if [ "$HEAD" != "$expected" ]; then
            echo "::error::A pull request into '$BASE' must come from '$expected', not '$HEAD'."
            echo "Branch flow is feat/* -> develop -> staging -> main; staging and main"
            echo "receive promotions only, never a work branch directly."
            exit 1
          fi
          echo "OK: '$HEAD' -> '$BASE' is a promotion."

  # A SEPARATE JOB, not a step in `pre-commit`, and that is the whole point.
  # Steps stop at the first failure, so as a trailing step this check was
  # hostage to the commit-message lint above: one non-conforming subject in the
  # range and the documentation check silently did not run at all. That happened
  # on a real promotion here — the run reported `skipped` for this check while
  # the PR looked merely "red on commit messages".
  #
  # Reordering would only reverse which check is hostage; separate jobs make
  # them independent in both directions. The guard stays at STEP level because
  # `hashFiles()` is not recognized in a job-level `if:`.
  docs-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # docgov's version-bump rule diffs against a base sha, so it needs
          # history, not a shallow clone.
          fetch-depth: 0

      # Optional: only runs if this repo also uses the docs-governance plugin
      # (github.com/licorsy/docs-governance) and has configured it.
      # Self-disables if the companion instead brings its own path-filtered
      # workflow (docs-governance.yml) — running both would check the same
      # PR twice. See AGENTS.md ("Companion plugins").
      - name: Check documentation consistency (docs-governance)
        if: github.event_name == 'pull_request' && hashFiles('.docgov.config.js') != '' && hashFiles('.github/workflows/docs-governance.yml') == ''
        uses: licorsy/docs-governance/action@v1
        with:
          base-sha: ${{ github.event.pull_request.base.sha }}

  # Secret scanning on every run, dependency review self-gated to staging/main
  # inside the reusable workflow. This repository ships no dependency manifest
  # today, so dependency-review passes trivially — it is wired now so the
  # coverage exists the moment one appears, rather than being remembered then.
  #
  # GITLEAKS_LICENSE is optional and organization-level; gitleaks runs without
  # it, with reduced functionality. See licorsy/platform-workflows' README.
  ci-security:
    uses: licorsy/platform-workflows/.github/workflows/ci-security.yml@v1
    secrets: inherit
